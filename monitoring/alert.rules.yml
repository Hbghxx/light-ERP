groups:
  - name: erp
    rules:
      - alert: ErpBackendDown
        expr: up{job="erp-backend"} == 0
        for: 1m
        annotations:
          summary: "ERP 后端不可达"
          description: "Prometheus 抓取 backend:8080 连续 1 分钟失败"

      - alert: ErpHigh5xx
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 1
        for: 2m
        annotations:
          summary: "ERP 5xx 错误速率过高"
          description: "最近 5 分钟 5xx 错误超过 1 次/秒"

      - alert: ErpHikariPoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 2m
        annotations:
          summary: "数据库连接池等待"
          description: "HikariCP 出现 pending 连接请求超过 2 分钟"
