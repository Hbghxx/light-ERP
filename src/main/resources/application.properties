# 应用配置
spring.application.name=erp
server.port=8080

# 数据库连接配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/erp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=114514

# MyBatis 配置
# 开启下划线自动转驼峰（例：product_sku -> productSku）
mybatis.configuration.map-underscore-to-camel-case=true

# 日志配置（控制台打印执行的 SQL 语句）
logging.level.com.example.erp.mapper=debug