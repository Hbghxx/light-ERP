# 应用配置
spring.application.name=erp
server.port=8080

# 数据库连接配置（支持环境变量覆盖，冒号后为本地开发默认值）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/erp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:114514}

# MyBatis 配置
# 开启下划线自动转驼峰（例：product_sku -> productSku）
mybatis.configuration.map-underscore-to-camel-case=true

# JWT 配置（生产环境务必用环境变量 ERP_JWT_SECRET 覆盖默认密钥）
erp.jwt.secret=${ERP_JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789}
erp.jwt.expire-hours=2

# 监控端点（仅供内网 Prometheus 抓取，Nginx 层已封禁外网访问 /actuator）
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

# 日志配置（控制台打印执行的 SQL 语句）
logging.level.com.example.erp.mapper=debug