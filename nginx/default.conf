server {
    listen 80;
    server_name _;

    # 监控端点仅限内网 Prometheus 抓取，禁止外网访问
    location /actuator/ {
        return 403;
    }

    # 前端静态页（单文件 index.html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 后端 API 反代：路径与 Controller 一致，保留原始 URI 转发
    location ~ ^/(product|inbound|outbound|stock|auth|user|role|dept|audit|report|approval)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
